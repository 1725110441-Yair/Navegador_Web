$def with (historial, pagina_actual)
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Navegador Web - Historial con Pila</title>
</head>
<body class="bg-secondary">

    <div class="container py-5" style="max-width: 650px;" data-bs-theme="dark">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h2 class="card-title text-center text-white mb-2">Navegador Web</h2>

                <div class="alert alert-secondary mb-4" role="alert">
                    <div class="small text-uppercase fw-bold text-white">Página actual:</div>
                    <div class="fs-5 fw-bold text-success">$pagina_actual</div>
                </div>

                <form method="POST" action="/" class="mb-3">
                    <input type="hidden" name="accion" value="visitar">
                    <div class="input-group">
                        <input type="text" name="url" class="form-control" placeholder="Escribe una URL (ej. www.google.com)" required>
                        <button class="btn btn-outline-success" type="submit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>  Visitar página
                        </button>
                    </div>
                </form>

                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <form method="POST" action="/">
                            <input type="hidden" name="accion" value="regresar">
                            <button class="btn btn-outline-primary w-100" type="submit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-90deg-left" viewBox="0 0 16 16">
                                    <path fill-rule="evenodd" d="M1.146 4.854a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 4H12.5A2.5 2.5 0 0 1 15 6.5v8a.5.5 0 0 1-1 0v-8A1.5 1.5 0 0 0 12.5 5H2.707l3.147 3.146a.5.5 0 1 1-.708.708z"/>
                                </svg>  Regresar página
                            </button>
                        </form>
                    </div>
                    <div class="col-6">
                        <form method="POST" action="/">
                            <input type="hidden" name="accion" value="eliminar">
                            <button class="btn btn-outline-danger w-100" type="submit" onclick="return confirm('¿Deseas eliminar todo el historial?')">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                                    <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                                </svg>  Vaciar historial
                            </button>
                        </form>
                    </div>
                </div>

                <h5 class="border-bottom pb-2 mb-3">Historial de páginas visitadas</h5>

                $if len(historial) > 0:
                    <ol class="list-group list-group-numbered">
                    $for pagina in historial:
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="ms-2 me-auto">$pagina</span>
                        </li>
                    </ol>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
