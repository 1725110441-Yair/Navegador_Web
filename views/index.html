$def with (historial, pagina_actual)
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Navegador Web - Historial con Pila</title>
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 650px;">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h2 class="card-title text-center text-primary mb-2">Navegador Web</h2>
                <p class="text-center text-muted mb-4">Estructura de datos: <strong>Pila (Stack - LIFO)</strong></p>

                <!-- 3. Mostrar la página actual -->
                <div class="alert alert-primary mb-4" role="alert">
                    <div class="small text-uppercase fw-bold text-secondary">Página actual:</div>
                    <div class="fs-5 fw-bold text-primary">$pagina_actual</div>
                </div>

                <!-- 1. Visitar una página web -->
                <form method="POST" action="/" class="mb-3">
                    <input type="hidden" name="accion" value="visitar">
                    <div class="input-group">
                        <input type="text" name="url" class="form-control" placeholder="Escribe una URL (ej. www.google.com)" required>
                        <button class="btn btn-success" type="submit">Visitar página</button>
                    </div>
                </form>

                <!-- 2. Regresar a la página anterior y 5. Eliminar historial -->
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <form method="POST" action="/">
                            <input type="hidden" name="accion" value="regresar">
                            <button class="btn btn-outline-primary w-100" type="submit">
                                &larr; Regresar página
                            </button>
                        </form>
                    </div>
                    <div class="col-6">
                        <form method="POST" action="/">
                            <input type="hidden" name="accion" value="eliminar">
                            <button class="btn btn-outline-danger w-100" type="submit" onclick="return confirm('¿Deseas eliminar todo el historial?')">
                                Vaciar historial
                            </button>
                        </form>
                    </div>
                </div>

                <!-- 4. Mostrar historial en orden descendente -->
                <h5 class="border-bottom pb-2 mb-3">Historial de páginas visitadas (LIFO)</h5>

                $if len(historial) == 0:
                    <div class="alert alert-secondary text-center mb-0">
                        El historial está vacío.
                    </div>
                $else:
                    <ol class="list-group list-group-numbered">
                    $for pagina in historial:
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span class="ms-2 me-auto">$pagina</span>
                        </li>
                    </ol>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
